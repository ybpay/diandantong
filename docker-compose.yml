version: '3.8'

x-app-env: &app-env
  RAILS_ENV: ${RAILS_ENV:-development}
  RACK_ENV: ${RACK_ENV:-development}
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:-development_secret_key_base_0b818b2119fcb1328992197b9507dc9e}
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-ddt_dev}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "11"
  WAIT_FOR_MYSQL: "true"
  WAIT_FOR_REDIS: "true"
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}

services:
  mysql:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ddt_dev}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ddt-network

  redis:
    image: redis:5.0-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ddt-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dummy_for_build}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-9000}:9000"
    environment: *app-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_uploads:/app/public/uploads
      - app_log:/app/log
      - ./config/database.yml.docker:/app/config/database.yml:ro
    networks:
      - ddt-network

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dummy_for_build}
    restart: unless-stopped
    command: bundle exec sidekiq -C config/sidekiq.yml -e ${RAILS_ENV:-development} -L log/sidekiq.log
    environment: *app-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_log:/app/log
      - ./config/database.yml.docker:/app/config/database.yml:ro
    networks:
      - ddt-network

volumes:
  mysql_data:
  redis_data:
  app_uploads:
  app_log:

networks:
  ddt-network:
    driver: bridge
