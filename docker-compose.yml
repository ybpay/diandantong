version: '3.8'

x-app-env: &app-env
  RAILS_ENV: ${RAILS_ENV:-development}
  RACK_ENV: ${RACK_ENV:-development}
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:-development_secret_key_base_0b818b2119fcb1328992197b9507dc9e}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DATABASE: ${POSTGRES_DATABASE:-ddt_dev}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "11"
  WAIT_FOR_POSTGRES: "true"
  WAIT_FOR_REDIS: "true"
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}

services:
  postgres:
    image: postgres:18
    container_name: ddt_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DATABASE:-ddt_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tools/pg_migration/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c max_connections=200
        -c default_text_search_config='pg_catalog.simple'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ddt-network

  redis:
    image: redis:8.6
    container_name: ddt_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ddt-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dummy_for_build}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-9000}:9000"
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_uploads:/app/public/uploads
      - app_log:/app/log
      - ./config/database.yml.docker:/app/config/database.yml:ro
    networks:
      - ddt-network

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dummy_for_build}
    restart: unless-stopped
    command: bundle exec sidekiq -C config/sidekiq.yml -e ${RAILS_ENV:-development} -L log/sidekiq.log
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_log:/app/log
      - ./config/database.yml.docker:/app/config/database.yml:ro
    networks:
      - ddt-network

volumes:
  postgres_data:
  redis_data:
  app_uploads:
  app_log:

networks:
  ddt-network:
    driver: bridge
