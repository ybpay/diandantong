groups:
  - name: diandantong_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors/sec (threshold: 0.05)"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time (P95)"
          description: "P95 response time is {{ $value }}s"

      - alert: SidekiqQueueBacklog
        expr: sidekiq_queue_size > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sidekiq queue backlog"
          description: "Queue {{ $labels.queue }} has {{ $value }} jobs"

      - alert: SidekiqFailedJobs
        expr: sidekiq_failed_jobs_total > 50
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High Sidekiq failure rate"
          description: "{{ $value }} failed jobs"

      - alert: DatabaseConnectionPoolExhausted
        expr: rails_db_connection_pool_available < 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool almost exhausted"
          description: "Only {{ $value }} connections available"

      - alert: MemoryUsageHigh
        expr: process_resident_memory_bytes / 1024 / 1024 > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Process using {{ $value }}MB of memory"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space"
          description: "Only {{ $value | humanizePercentage }} disk space remaining"
