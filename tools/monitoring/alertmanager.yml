# Alertmanager configuration for diandantong
route:
  receiver: "default"
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: "critical"
      group_wait: 10s
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: "warning"
      repeat_interval: 6h

receivers:
  - name: "default"
    webhook_configs:
      - url: "http://app:3000/webhooks/alerts"
        send_resolved: true

  - name: "critical"
    webhook_configs:
      - url: "http://app:3000/webhooks/alerts/critical"
        send_resolved: true
    # Uncomment and configure for WeChat/DingTalk/Email notifications:
    # email_configs:
    #   - to: "ops@diandantong.com"
    #     from: "alerts@diandantong.com"
    #     smarthost: "smtp.exmail.qq.com:25"

  - name: "warning"
    webhook_configs:
      - url: "http://app:3000/webhooks/alerts/warning"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "service"]
