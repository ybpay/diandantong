# Prometheus monitoring config for diandantong
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: diandantong
    environment: production

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "rails_app"
    metrics_path: "/metrics"
    scheme: http
    static_configs:
      - targets: ["app:9394"]
        labels:
          service: "rails"
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: "sidekiq"
    metrics_path: "/metrics"
    scheme: http
    static_configs:
      - targets: ["sidekiq:9394"]
        labels:
          service: "sidekiq"
    scrape_interval: 30s

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres_exporter:9187"]
        labels:
          service: "postgresql"
    scrape_interval: 30s

  - job_name: "redis"
    static_configs:
      - targets: ["redis_exporter:9121"]
        labels:
          service: "redis"
    scrape_interval: 30s

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx_exporter:9113"]
        labels:
          service: "nginx"
    scrape_interval: 30s
