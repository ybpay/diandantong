# Prometheus monitoring config for diandantong
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "rails_app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:3000"]
    scrape_interval: 10s

  - job_name: "sidekiq"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["sidekiq:3000"]
    scrape_interval: 30s

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis_exporter:9121"]

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx_exporter:9113"]
