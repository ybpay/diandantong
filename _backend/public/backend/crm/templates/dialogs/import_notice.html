<md-dialog flex="60">
  <md-toolbar class="md-toolbar-tools">
    <h2>导入会员文件格式要求</h2>
    <span flex></span>
    <md-button class="md-icon-button" ng-click="close()">
      <md-icon>close</md-icon>
    </md-button>
  </md-toolbar>
  <md-dialog-content class="md-dialog-content">
    1. 导入会员请先使用“导出会员”功能获得导入模板，参考模板格式。
    <br/>
    2. 批量导入格式为: 会员号 姓名 手机号 会员等级 会员余额 会员积分 累计消费 累计下单 性别 身份证号 出生日期 地址 邮箱 备注
    <br/>
    3. 会员号,姓名,手机号,会员等级为必填项, 且会员号不能重复
  </md-dialog-content>
</md-dialog>
