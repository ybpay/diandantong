<!DOCTYPE html>
<html>
<head>
    <title>跳转到支付宝页面进行支付</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta content="telephone=no" name="format-detection"/>
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
    <style>
        body {
            background-color: rgba(0, 0, 0, 0.8);
        }
    </style>
    <script>
        // native javascript

        var shop_id;
        var branch_id;
        var order_type;
        var order_id;
        var wap_url;
        // /weixin/shops/1/branches/9/payment_orders/7016/check_order_paid
        function buildQueryUrl(){
            return "/weixin/shops/" + shop_id + "/branches/" + branch_id + "/" + order_type + "_orders/" + order_id + "/check_order_paid"
        }

        function parseQuery(){
            var query = window.location.search.substring(1);
            var vars = query.split('&');
            for (var i = 0; i < vars.length; i++) {
                var pair = vars[i].split('=');
                switch(decodeURIComponent(pair[0])){
                    case 'shop_id':
                        shop_id = decodeURIComponent(pair[1]);
                        break;
                    case 'branch_id':
                        branch_id = decodeURIComponent(pair[1]);
                        break;
                    case 'order_type':
                        order_type = decodeURIComponent(pair[1]);
                        break;
                    case 'order_id':
                        order_id = decodeURIComponent(pair[1]);
                        break;
                    case 'wap_url':
                        wap_url = decodeURIComponent(pair[1]);
                        break;
                }
            }
        }

        function Ajax(type, url, data, success, failed){
            // 创建ajax对象
            var xhr = null;
            if(window.XMLHttpRequest){
                xhr = new XMLHttpRequest();
            } else {
                xhr = new ActiveXObject('Microsoft.XMLHTTP')
            }

            var type = type.toUpperCase();
            // 用于清除缓存
            var random = Math.random();

            if(typeof data == 'object'){
                var str = '';
                for(var key in data){
                    str += key+'='+data[key]+'&';
                }
                data = str.replace(/&$/, '');
            }

            if(type == 'GET'){
                if(data){
                    xhr.open('GET', url + '?' + data, true);
                } else {
                    xhr.open('GET', url + '?t=' + random, true);
                }
                xhr.send();

            } else if(type == 'POST'){
                xhr.open('POST', url, true);
                // 如果需要像 html 表单那样 POST 数据，请使用 setRequestHeader() 来添加 http 头。
                xhr.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
                xhr.send(data);
            }

            // 处理返回数据
            xhr.onreadystatechange = function(){
                if(xhr.readyState == 4){
                    if(xhr.status == 200){
                        success(xhr.responseText);
                    } else {
                        if(failed){
                            failed(xhr.status);
                        }
                    }
                }
            }
        }


        parseQuery();
        if (/MicroMessenger/i.test(navigator.userAgent)) {
            setTimeout(function check_order_paid(){
                Ajax('GET', buildQueryUrl(), {
                    rand: Math.random()
                }, function(data){
                    data = JSON.parse(data);
                    if (data.paid){
                        window.location.href = data.order_url;
                    } else {
                        setTimeout(check_order_paid, 3000);
                    }
                }, function(status){
                    alert('查询订单#' + order_id + "出错:" + status);
                });
            }, 3000);
        } else {
            if (wap_url) {
                window.location.href = wap_url
            } else {
                alert('支付地址出错了');
            }
        }
    </script>
</head>
<body>
<img src="/images/ddt/live_weixin.png" style="max-width:100%; height:auto;"/>
</body>
</html>
