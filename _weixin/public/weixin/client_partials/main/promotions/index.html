<div id="promotion-index-page" class="main-view">
  <div class="promotion-item" ng-click="go('/promotions/' + promotion.id)" ng-repeat="promotion in promotions">
    <img ng-src="{{promotion.image}}"/> 
    <div class="title dark">
          {{promotion.name}}
    </div>
    <div class="dark-gray keywords overflow-ellipsis">{{promotion.keywords}}</div>
  </div>
</div>
