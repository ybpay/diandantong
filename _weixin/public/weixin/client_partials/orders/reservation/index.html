<div common-header></div>
<div class="ddb-secondary-nav-header orders-index-secondary-nav">
  <div class="filter-switch">
    <div class="filter-tab" ng-click="change_filter_tab('all')" ng-class="{'active': tab_key == 'all'}">
      全部记录
    </div>
    <div class="filter-tab" ng-click="change_filter_tab('no-comments')" ng-class="{'active': tab_key == 'no-comments'}">
      待评价
    </div>
  </div>
</div>
<div class="orders-index-page main-view" id="reservation-orders-index">
  <div class="space-12"></div>

  <div class="no-record" ng-if="orders.length == 0">
    没有找到订单
  </div>
  <div class="order-item section" ng-repeat="order in orders">
    <div class="time list-item" ng-click="go_detail(order)">创建时间：{{::order.placed_at|moment}}</div>
    <div class="list-item">
      <div class="icon">
        <div class="check-icon">
          <i class="fa fa-check-square-o"></i>
        </div>
      </div>
      <div class="reservation-order-info" ng-click="go_detail(order)">
        <div class="name">{{::order.branch_name}}</div>
        <div class="table-zone">{{::order.table_zone_name}}</div>
        <div class="reservation-time-point">预订时间 {{::order.reservation_date_str}} {{::order.reservation_time_point_str}}</div>
      </div>
    </div>
    <div class="list-item">
      <div class="total-amount"><span class="amount-label">金额：</span>{{::order.total|currency: currency}}(预付 {{::order.amount_for_pay}})</div>
      <div class="operation">
        <span  ng-if="(order.state == 'canceled')||(order.state == 'completed')" class="closed workflow-state">
          {{::order.state_name}}
        </span>
        <span  class="button" ng-if="order.state == 'pending' || order.state == 'confirmed'">
          {{::order.state_name}}
        </span>
        <span class="button" ng-if="order.state == 'completed' && !order.is_commented">
          <a ng-click="go_new_comment(order)">评价</a>
        </span>
      </div>
      <div class="space"></div>
    </div>
  </div>
  <div class="space-12"></div>
</div>
