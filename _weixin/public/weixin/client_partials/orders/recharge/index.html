<div common-header></div>
<div class="ddb-secondary-nav-header orders-index-secondary-nav">
  <div class="filter-switch">
    <div class="filter-tab" ng-click="change_filter_tab('all')" ng-class="{'active': tab_key == 'all'}">
      充值订单
    </div>
    <div class="filter-tab" ng-click="change_filter_tab('no-comments')" ng-class="{'active': tab_key == 'no-comments'}">
      待评价
    </div>
  </div>
</div>
<div class="orders-index-page main-view" id="delivery-orders-index">
  <div class="space-12"></div>

  <div class="section" ng-if="orders.length == 0">
    <div class="list-item center">
      没有找到订单
    </div>
  </div>

  <div class="order-item section" ng-repeat="order in orders">
    <a ng-click="go_detail(order)" class="list-item">
      <div class="time">下单时间：{{::order.placed_at|moment}}</div>
    </a>
    <a ng-click="go_detail(order)" class="list-item">
      <div class="name">{{::order.branch_name}}</div>
    </a>
    <div class="list-item">
        <div class="total-amount"><span class="amount-label">金额：</span>{{::order.total|currency: currency}}</div>
        <div class="operation">
          <span  ng-if="(order.state == 'canceled')||(order.state == 'completed')" class="closed workflow-state">
            {{::order.state_name}}
          </span>
          <span  class="button" ng-if="order.state == 'pending' || order.state == 'confirm'">
            {{::order.state_name}}
          </span>
          <span class="button" ng-if="order.state == 'completed' && !order.is_commented">
            <a ng-click="go_new_comment(order)">评价</a>
          </span>
        </div>
      <div class="space"></div>
    </div>
  </div>
  <div class="space-12"></div>
</div>
