<div class="censor-report-wrap">
    <div class="ddb-nav-header">
        <div class="nav-left-item" ng-click="back()"><i class="fa fa-angle-left"></i></div>
        <div class="header-title">{{header_title}}</div>
        <div class="nav-right-item">
            <div ng-click="report()" class='operation-button'>提交</div>
        </div>
    </div>
    <div class="main-view">
        <div class="space-12"></div>
        <div class="section">
            <div class="list-item ddb-form-control">
                <div class="ddb-form-label">标题</div>
                <input type="text" class="ddb-form-input" ng-model="data.title" placeholder="例如：首页有色情图片" required="true"/>
            </div>
            <div class="list-item ddb-form-control">
                <textarea class="ddb-form-input" ng-model="data.desc" placeholder="详细地描述举报内容" required="true"/>
            </div>
        </div>
    </div>
</div>
