<div id="vip-info-detail" class="main-view">
  <div class="padding-10"></div>
  <div class="weui_cells_title">
    会员基本信息
  </div>

  <div class="weui_cells">
    <div class="weui_cell">
      <div class="weui_cell_bd weui_cell_primary">会员编号:</div>
        <div class="weui_cell_ft">{{user.vip_info.vip_no}}</div>
    </div>

    <div class="weui_cell">
      <div class="weui_cell_bd weui_cell_primary">会员级别:</div>
        <div class="weui_cell_ft">{{user.vip_info.vip_level_name}}</div>
    </div>

    <div class="weui_cell">
      <div class="weui_cell_bd weui_cell_primary">姓名:</div>
        <div class="weui_cell_ft">{{user.vip_info.name}}</div>
    </div>

    <div class="weui_cell">
      <div class="weui_cell_bd weui_cell_primary">生日:</div>
        <div class="weui_cell_ft">{{user.vip_info.birthday}}</div>
    </div>

    <div class="weui_cell">
      <div class="weui_cell_bd weui_cell_primary">手机号:</div>
        <div class="weui_cell_ft">{{user.vip_info.phone}}</div>
    </div>

    <div class="weui_cell">
      <div class="weui_cell_bd weui_cell_primary">邮箱:</div>
        <div class="weui_cell_ft">{{user.vip_info.email}}</div>
    </div>

    <div class="weui_cell">
      <div class="weui_cell_bd weui_cell_primary">地址:</div>
        <div class="weui_cell_ft">{{user.vip_info.address}}</div>
    </div>
</div>
