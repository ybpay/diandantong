<div id="scan-code-section">
  <div class="scan-code-zone" ng-if="user.is_vip">
    <div class="barcode" ng-bind-html="code.barcode|unsafe"></div>
    <div class="barcode-number">{{code.code}}</div>
    <div class="qrcode" ng-bind-html="code.qrcode|unsafe"></div>
    <div class="scan-code-hint">每两分钟更新一次</div>
  </div>
</div>
