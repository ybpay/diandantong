<div id="tuan-index-page">
  
  <div class="weui_panel weui_panel_access">
      <div class="weui_panel_hd">热门团购</div>
      <div class="weui_panel_bd">
          <a  ng-click="go('/tuans/' + tuan.id);" class="weui_media_box weui_media_appmsg" ng-repeat="tuan in tuans" >
              <div class="weui_media_hd">
                  <img class="weui_media_appmsg_thumb" ng-src="{{::tuan.photo}}" alt="">
              </div>
              <div class="weui_media_bd">
                  <h4 class="weui_media_title">{{::tuan.name}}</h4>
                  <p class="weui_media_desc">{{::tuan.branch.name}}</p>
                  <p class="weui_media_desc">
                    <span class="groupon-price orange">{{::tuan.groupon_price | currency:currency}}</span>
                    <span class="price">{{::tuan.norminal_value | currency:currency}}</span>
                    <span class="sales">已售 {{::tuan.base_coupons_count}}</span>
                  </p>

              </div>
          </a>
      </div>
  </div>

</div>
