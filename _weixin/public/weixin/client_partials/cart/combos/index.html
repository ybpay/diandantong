<div class="combos-page" id="combo-index-page">
  <div class="ddb-nav-footer">
    <a class="button checkout-button right" ng-class="{'disable': !can_submit() }" ng-click="submit()">选好了</a>
  </div>
  <div class="main-view combos-page-body">
    <div class="combos-list">
      <ul class="combos">
        <li class="item" ng-repeat="combo in combos" ng-click="change_active_combo(combo)" ng-class="{'active': combo == active_combo}">
          <span class="name">{{::combo.name}}</span>
        </li>
      </ul>
    </div>
    <div class="combo-items">
      <div class="combo-item" ng-repeat="combo_item in active_combo.combo_items">
        <div class="combo-item-name"
             ng-click="toggle_combo_item(combo_item)">
             {{::combo_item.name}}
             ({{combo_item.quantity}}/{{combo_item.select_count}})
             <span><i class="fa fa-angle-down"></i></span>
        </div>
        <div class="combo-variants" ng-show="combo_item.show">
          <div ng-repeat="variant in combo_item.variants" class="variant-item" ng-class="{'in-cart': variant.quantity>0}">
            <div class="loading-image" rn-lazy-background="{{variant.image}}" rn-lazy-loading-class="loading-image" rn-lazy-loaded-class="loaded-image" ng-if="variant.image"></div>
            <div ng-class="{'no-image': !variant.image}">
              <div class="name">
                {{::variant.name}}
                <span class="tag" ng-style="{'background-color': tag_in_branch(tag_id, branch).color}" ng-repeat="tag_id in variant.tag_ids">{{tag_in_branch(tag_id, branch).name}}</span>
              </div>
              <div class="sales">
                <span class="stock_count" ng-show="branch.check_stock && branch.show_stock_quantity">库存{{stock_of(variant)}},</span>
              </div>
              <div class="price-section">
                <div class="cart-op">
                  <span class="button minus-button active" ng-show="can_remove(combo_item, variant)" ng-click="remove_item(combo_item, variant);"><i class="fa fa-minus"></i></span>
                  <span class="quantity-button" ng-show="variant.quantity>0">{{variant.quantity}}</span>
                  <span class="button plus-button" ng-class="{'active': can_add(combo_item, variant)}" ng-click="add_item(combo_item, variant);"><i class="fa fa-plus"></i></span>
                </div>
                <span class="original-price">{{variant.price|currency:currency}}</span>
                <span ng-show="variant.unit_name">/{{variant.unit_name}}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
