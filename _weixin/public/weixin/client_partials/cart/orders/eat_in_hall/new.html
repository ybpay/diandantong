<div id="new-order-checkout-page" class="order-checkout-page">
  <div id='new-order-form' class="main-view">

    <div class="weui_cells">
      <div class="weui_cell weui_cell_select weui_select_after" ng-if="can_select_delivery_zone()">
          <div class="weui_cell_hd">
              桌台
          </div>
          <div class="weui_cell_ft">
              {{::cart.table.name_with_zone}}
          </div>
      </div>
    </div>


    <div class="weui_cells weui_cells_form" ng-if="input_pay_method && coupons.length > 0">
      <div class="weui_cell weui_cell_switch" ng-if="coupons.length > 0">
          <div class="weui_cell_hd">
              是否使用优惠券
          </div>
          <div class="weui_cell_primary weui_cell_ft">
              <input class="weui_switch" type="checkbox" ng-model="self.use_coupon" ng-change="use_coupon && load_coupons();">
          </div>
      </div>
      <div class="weui_cell weui_cell_select weui_select_after" ng-if="use_coupon && coupons_loaded && coupons.length > 0">
          <div class="weui_cell_hd">
              可用优惠券
          </div>
          <div class="weui_cell_bd weui_cell_primary">
              <select class="weui_select" ng-model="self.current_coupon" ng-options="get_coupon_label(coupon) for coupon in coupons"
                  ng-change="apply_coupon()" required="false">
                  <option value="" disabled selected> 选择优惠券</option>
              </select>
          </div>
      </div>
    </div>


    <div ng-include src="partial('cart/orders/cart-adjustments')"></div>
    <div ng-include src="partial('cart/orders/new-common-form')"></div>
    <div class="recharge-actions">
      <div class="weui_btn" ng-class="{'bg-red': errors().length == 0, 'weui_btn_disabled': errors().length >0}" ng-click="submit()">
         立即下单 {{cart.total|currency:shop.currency}}
      </div>
    </div>
  </div>
</div>
