<div class="weui_cells" ng-if="cart.adjustments.length > 0">
  <div class="weui_cell" ng-repeat="adjustment in cart.adjustments">
    <div class="weui_cell_primary">
      {{adjustment.label}}
    </div>
    <div class="weui_cell_ft">
     <span ng-if="adjustment.amount < 0">-</span>{{adjustment.amount|currency: currency}} 
    </div>
  </div>
</div>
