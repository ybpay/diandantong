services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - RAILS_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-diandantong}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-diandantong_production}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - RAILS_LOG_TO_STDOUT=true
      - RAILS_SERVE_STATIC_FILES=true
      - HOST=${HOST:-cy.diandantong.com}
      - SOLID_QUEUE_IN_PUMA=true
      - PROMETHEUS_EXPORTER_ENABLED=${PROMETHEUS_EXPORTER_ENABLED:-true}
      - PROMETHEUS_EXPORTER_HOST=${PROMETHEUS_EXPORTER_HOST:-0.0.0.0}
      - PROMETHEUS_EXPORTER_PORT=${PROMETHEUS_EXPORTER_PORT:-9394}
      - RAILS_LOG_FORMAT=${RAILS_LOG_FORMAT:-json}
    ports:
      - "3000:3000"
      - "9394:9394"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile
    command: bundle exec sidekiq
    environment:
      - RAILS_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-diandantong}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-diandantong_production}
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - RAILS_LOG_TO_STDOUT=true
      - PROMETHEUS_EXPORTER_ENABLED=${PROMETHEUS_EXPORTER_ENABLED:-true}
      - PROMETHEUS_EXPORTER_HOST=${PROMETHEUS_EXPORTER_HOST:-0.0.0.0}
      - PROMETHEUS_EXPORTER_PORT=${PROMETHEUS_EXPORTER_PORT:-9394}
      - RAILS_LOG_FORMAT=${RAILS_LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-diandantong}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-diandantong_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-diandantong}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  redis:
    image: redis:8.6-alpine
    command: >
      redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save 900 1
        --save 300 10
        --save 60 10000
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - HOST=${HOST:-cy.diandantong.com}
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_data:/etc/letsencrypt:ro
      - nginx_log:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: []
    command: >
      sh -c "echo '0 2 * * * cd /rails && bundle exec rake backup:all' > /etc/crontabs/root
      && crond -f -l 2"
    environment:
      - RAILS_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-diandantong}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-diandantong_production}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - BACKUP_DIR=/var/backups/diandantong
      - S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - postgres_backup:/var/backups/diandantong
      - redis_data:/data:ro
      - app_uploads:/rails/public/uploads:ro
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  certbot_data:
  nginx_log:
  postgres_backup:
  app_uploads:
