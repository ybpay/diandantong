# Monitoring stack for diandantong — Prometheus + Grafana + Loki + Promtail + Exporters
# Usage: docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ddt_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./tools/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./tools/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./tools/monitoring/alertmanager.yml:/etc/prometheus/alertmanager.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.enable-lifecycle"
    networks:
      - ddt-network

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: ddt_alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./tools/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - ddt-network

  grafana:
    image: grafana/grafana:11.5.0
    container_name: ddt_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rails-overview.json
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./tools/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./tools/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - ddt-network

  loki:
    image: grafana/loki:3.3.2
    container_name: ddt_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./tools/monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ddt-network

  promtail:
    image: grafana/promtail:3.3.2
    container_name: ddt_promtail
    restart: unless-stopped
    volumes:
      - ./tools/monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - app_log:/var/log/rails:ro
      - nginx_log:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - ddt-network

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: ddt_postgres_exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-diandantong}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-diandantong_production}?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - ddt-network

  redis_exporter:
    image: oliver006/redis_exporter:v1.69.0
    container_name: ddt_redis_exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis:6379"
    depends_on:
      - redis
    networks:
      - ddt-network

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.4.1
    container_name: ddt_nginx_exporter
    restart: unless-stopped
    ports:
      - "9113:9113"
    command:
      - "--nginx.scrape-uri=http://nginx:80/stub_status"
    depends_on:
      - nginx
    networks:
      - ddt-network

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:

networks:
  ddt-network:
    external: true
    name: ddt_ddt-network
