service: diandantong

image: your-registry/diandantong

servers:
  web:
    - 1.2.3.4
  workers:
    - 1.2.3.4

registry:
  server: your-registry.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - SECRET_KEY_BASE
    - DB_PASSWORD
    - DB_USER
    - DB_NAME
    - DB_HOST
    - REDIS_URL
    - HOST
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: true
    RAILS_SERVE_STATIC_FILES: true
    SOLID_QUEUE_IN_PUMA: true

volumes:
  - "storage:/rails/storage"

asset_path: /rails/public/assets

labels:
  app: diandantong
  environment: production

healthcheck:
  path: /up
  interval: 30
  timeout: 5
  retries: 3

accessories:
  db:
    image: postgres:18-alpine
    host: 1.2.3.4
    env:
      secret:
        - POSTGRES_PASSWORD
      clear:
        POSTGRES_USER: diandantong
        POSTGRES_DB: diandantong_production
    volumes:
      - "postgres:/var/lib/postgresql/data"
    options:
      health-cmd: "pg_isready -U diandantong"
      health-interval: 10s
      health-timeout: 5s
      health-retries: 5

  redis:
    image: redis:8.6-alpine
    host: 1.2.3.4
    volumes:
      - "redis:/data"
    cmd: "redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru"
    options:
      health-cmd: "redis-cli ping"
      health-interval: 10s
      health-timeout: 5s
      health-retries: 5
