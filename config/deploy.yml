service: diandantong

image: your-registry/diandantong

servers:
  web:
    - 1.2.3.4
  workers:
    - 1.2.3.4

registry:
  server: your-registry.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - SECRET_KEY_BASE
    - DB_PASSWORD
    - DB_USER
    - DB_NAME
    - DB_HOST
    - REDIS_URL
    - HOST
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: true
    RAILS_SERVE_STATIC_FILES: true
    RAILS_LOG_FORMAT: json
    SOLID_QUEUE_IN_PUMA: true
    PROMETHEUS_EXPORTER_ENABLED: true
    PROMETHEUS_EXPORTER_HOST: 0.0.0.0
    PROMETHEUS_EXPORTER_PORT: 9394

volumes:
  - "storage:/rails/storage"

asset_path: /rails/public/assets

labels:
  app: diandantong
  environment: production

healthcheck:
  path: /up
  interval: 30
  timeout: 5
  retries: 3

accessories:
  db:
    image: postgres:18-alpine
    host: 1.2.3.4
    env:
      secret:
        - POSTGRES_PASSWORD
      clear:
        POSTGRES_USER: diandantong
        POSTGRES_DB: diandantong_production
    volumes:
      - "postgres:/var/lib/postgresql/data"
    options:
      health-cmd: "pg_isready -U diandantong"
      health-interval: 10s
      health-timeout: 5s
      health-retries: 5

  redis:
    image: redis:8.6-alpine
    host: 1.2.3.4
    volumes:
      - "redis:/data"
    cmd: "redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --save 60 10000"
    options:
      health-cmd: "redis-cli ping"
      health-interval: 10s
      health-timeout: 5s
      health-retries: 5

  prometheus:
    image: prom/prometheus:v3.1.0
    host: 1.2.3.4
    volumes:
      - "prometheus:/prometheus"
    files:
      - tools/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - tools/monitoring/alerts.yml:/etc/prometheus/alerts.yml
    options:
      network: "private"

  grafana:
    image: grafana/grafana:11.5.0
    host: 1.2.3.4
    env:
      clear:
        GF_SECURITY_ADMIN_USER: admin
        GF_USERS_ALLOW_SIGN_UP: "false"
      secret:
        - GF_SECURITY_ADMIN_PASSWORD
    volumes:
      - "grafana:/var/lib/grafana"
    files:
      - tools/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - tools/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    options:
      network: "private"

  loki:
    image: grafana/loki:3.3.2
    host: 1.2.3.4
    volumes:
      - "loki:/loki"
    files:
      - tools/monitoring/loki.yml:/etc/loki/local-config.yaml
    options:
      network: "private"
